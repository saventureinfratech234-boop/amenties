<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Saventure : Interior Design, Architecture & Digital Marketing...</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="logo.png">

    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"/>

</head>
<body>

<section class="amenities">

<div class="amenities-box">

        <div class="amenities-title">
            <h2>AMENITIES</h2>
        </div>

<!-- ICON BOXES -->

<div class="cards">

<div class="card">

    <img src="security.jpg"
         alt="24/7 Security"
         class="amenity-img"
         onclick="openImage('security.jpg')">

    <h5>24/7 SECURITY</h5>

</div>

<div class="card">

    <img src="children.jpg"
         alt="Children's Play Area"
         class="amenity-img"
         onclick="openImage('children.jpg')">

    <h5>CHILDREN'S PLAY AREA</h5>

</div>

<div class="card">

    <img src="library.jpg"
         alt="Library"
         class="amenity-img"
         onclick="openImage('library.jpg')">

    <h5>LIBRARY</h5>

</div>

<div class="card">

    <img src="swimming.jpg"
         alt="Swimming Pool"
         class="amenity-img"
         onclick="openImage('swimming.jpg')">

    <h5>SWIMMING POOL</h5>

</div>

<div class="card">

    <img src="gymnasium.jpg"
         alt="Gymnasium"
         class="amenity-img"
         onclick="openImage('gymnasium.jpg')">

    <h5>GYMNASIUM</h5>

</div>

</div>

</div>

</section>

<!-- Image Popup -->

<div class="image-popup" id="imagePopup">

    <span class="close-btn" onclick="closeImage()">&times;</span>

    <img id="popupImage" src="" alt="Amenity Image">

</div>

<script>

const popup = document.getElementById("imagePopup");
const popupImage = document.getElementById("popupImage");

function openImage(image){

    popup.classList.add("active");
    popupImage.src = image;

}

function closeImage(){

    popup.classList.remove("active");

}

// Close when clicking outside image

popup.addEventListener("click", function(e){

    if(e.target === popup){

        closeImage();

    }

});

// Close on ESC key

document.addEventListener("keydown", function(e){

    if(e.key === "Escape"){

        closeImage();

    }

});

</script>


</body>
</html>
